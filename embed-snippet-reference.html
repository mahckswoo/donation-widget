<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Donate Widget — lottie-web embed test</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: flex-end; justify-content: flex-end;
         background: #f4f6f8; font-family: sans-serif; }
  /* simulates a partner site footer placement */
  #donate-widget { width: 132px; height: 152px; cursor: pointer; margin: 24px; }
  #status { position: fixed; top: 12px; left: 12px; color: #676d75; font-size: 13px; }
</style>
</head>
<body>
<div id="status">lottie-web embed test — hover the widget for the excited hop, click to "open iframe"</div>
<div id="donate-widget" title="Donate"></div>
<script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"
        integrity="sha384-J8C0MvgX4WP58J4N2W99vCKd2J6z99ynOJ5bEfE6jeP7kVTW1drYtv/jzrxM5jbm"
        crossorigin="anonymous"></script>
<script>
(function () {
  var IDLE = [0, 120], HOVER = [120, 180];
  var el = document.getElementById('donate-widget');
  var anim = lottie.loadAnimation({
    container: el,
    renderer: 'svg',
    loop: false,
    autoplay: false,
    path: '/projects/donation-widget/scene-1/lottie.json',
  });
  var wantHover = false;
  function playIdle() { anim.playSegments(IDLE, true); }
  function playHover() { anim.playSegments(HOVER, true); }
  anim.addEventListener('DOMLoaded', playIdle);
  anim.addEventListener('complete', function () { wantHover ? playHover() : playIdle(); });
  el.addEventListener('mouseenter', function () { wantHover = true; playHover(); });
  el.addEventListener('mouseleave', function () { wantHover = false; });
  el.addEventListener('click', function () {
    // production embed: open the donation iframe/modal here
    document.getElementById('status').textContent = 'click received — donation iframe would open here';
    console.log('[donate-widget] click -> open donation iframe');
  });
})();
</script>
</body>
</html>
